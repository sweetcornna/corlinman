[project]
name = "corlinman-runtime"
version = "0.1.0"
description = "Dependency-leaf runtime path and execution-state layout helpers."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "corlinman contributors" }]

dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corlinman_runtime"]
